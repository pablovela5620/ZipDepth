[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zipdepth"
version = "1.0.0"
requires-python = ">=3.11,<3.13"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
numpy = ">=2.0.0"
opencv = { version = ">=4.10.0,<5", build = "headless_*" }
pillow = ">=10.0.0"
matplotlib = ">=3.9.0"
albumentations = ">=2.0.0"
h5py = ">=3.10.0"
tqdm = ">=4.66.0"
pyyaml = ">=6.0"
tensorboard = ">=2.16.0"
libjpeg-turbo = ">=3.0.0,<4"

[tool.pixi.pypi-dependencies]
torch = ">=2.12.0"
torchvision = ">=0.27.0"
pyturbojpeg = ">=2.0.0,<3"
zipdepth = { path = ".", editable = true }

[tool.pixi.tasks]
start = "python scripts/infer.py --checkpoint checkpoints/zipdepth_base.pth --input assets/examples/im0.jpg --input-size 384"
